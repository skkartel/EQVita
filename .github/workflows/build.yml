name: Build EQVita
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Build Project
        run: |
          mkdir build && cd build
          cmake ..
          make
          
      - name: Upload VPK and Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EQVita-Slim-Build
          path: |
            build/plugin/*.skprx
            build/app/*.vpk
