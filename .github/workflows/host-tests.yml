name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build-host -DEQVITA_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-host --parallel

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

      - name: Build script guard tests
        shell: pwsh
        run: ./scripts/test-build-wsl-validation.ps1

  vita-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Vita artifacts
        run: |
          docker run --rm \
            -v "$PWD:/build/git" \
            -w /build/git \
            vitasdk/vitasdk@sha256:2d7203c960a3f76a1fcec72d8dcfb97ddbbde8086b56458291f54e2ec17fb0f3 \
            bash -lc 'arm-vita-eabi-gcc --version && cmake --version && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel'
