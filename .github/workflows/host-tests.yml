name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-host -DEQVITA_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-host --parallel

      - name: Test
        run: ctest --test-dir build-host --output-on-failure

      - name: Build script guard tests
        shell: pwsh
        run: ./scripts/test-build-wsl-validation.ps1

      - name: WSL shell build script guard tests
        run: bash scripts/test-wsl-shell-validation.sh

      - name: Release hygiene checks
        shell: pwsh
        run: ./scripts/check-release-hygiene.ps1

  vita-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Vita artifacts
        run: |
          docker run --rm \
            -v "$PWD:/build/git" \
            -w /build/git \
            vitasdk/vitasdk@sha256:2d7203c960a3f76a1fcec72d8dcfb97ddbbde8086b56458291f54e2ec17fb0f3 \
            bash -lc 'arm-vita-eabi-gcc --version && cmake --version && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel'

      - name: Create artifact checksums
        run: |
          test -f build/app/EQVita.vpk
          test -f build/plugin/eq_speaker.skprx
          sha256sum build/app/EQVita.vpk build/plugin/eq_speaker.skprx | sudo tee build/EQVita.sha256 > /dev/null

      - name: Upload Vita artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eqvita-vita-artifacts
          path: |
            build/app/EQVita.vpk
            build/plugin/eq_speaker.skprx
            build/EQVita.sha256
          if-no-files-found: error
